<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tiếng Trung</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>📖 Luyện tiếng Trung</h1>

    <div class="card">

        <h3>Câu tiếng Việt</h3>

        <p id="vietnamese">
            Hôm nay tôi rất vui.
        </p>

        <button id="listenBtn">
            🔊 Nghe tiếng Trung
        </button>

        <input
            type="text"
            id="answer"
            placeholder="Nhập tiếng Trung..."
        >

        <div class="buttons">
            <button id="checkBtn">Kiểm tra</button>
            <button id="nextBtn">Câu tiếp</button>
        </div>

        <div id="result"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
