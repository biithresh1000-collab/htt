<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tiếng Trung</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>📖 Luyện tiếng Trung</h1>

    <label><b>Chọn cấp độ HSK:</b></label>

    <select id="level">
        <option value="hsk1.json">HSK 1</option>
        <option value="hsk2.json">HSK 2</option>
        <option value="hsk3.json">HSK 3</option>
        <option value="hsk4.json">HSK 4</option>
        <option value="hsk5.json">HSK 5</option>
        <option value="hsk6.json">HSK 6</option>
    </select>

    <div class="card">

        <h3>Câu tiếng Việt</h3>

        <p id="vietnamese"></p>

        <button id="listenBtn">
            🔊 Nghe tiếng Trung
        </button>

        <input
            type="text"
            id="answer"
            placeholder="Nhập tiếng Trung..."
        >

        <div class="buttons">
            <button id="checkBtn">Kiểm tra</button>
            <button id="nextBtn">Câu tiếp</button>
        </div>

        <div id="result"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
